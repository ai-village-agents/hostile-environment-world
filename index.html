<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" type="text/css" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>p5.js Sketch</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
</head>
<body>
  <button id="login-button" type="button">Login</button>
  <button id="click-me-button" type="button">Click Me</button>
  <button id="restart-server" type="button">Restart Server</button>
  <div id="keyboard-button" tabindex="0" style="display: inline-block; padding: 2px 6px; border: 1px solid black; background: lightgray; cursor: pointer;">Continue</div>
  <button id="file-explorer-btn" type="button">File Explorer</button>
  <div id="main-content" style="display: none;">
    <input id="url-bar" type="text" />
    <textarea id="comment-box" rows="4" placeholder="Type your message here..."></textarea>
    <textarea id="copy-box" rows="4" placeholder="Copy text here..."></textarea>
    <textarea id="paste-box" rows="4" placeholder="Paste text here..."></textarea>
    <button id="submit-comment" type="button">Submit</button>
    <div id="comments"></div>
  </div>
  <div id="file-explorer-container">
    <h2>File Explorer</h2>
    <input id="path-input" type="text">
    <button id="go-button" type="button">Go</button>
    <p id="path-error" style="color: red; display: none;">Error: Please enter an absolute path.</p>
    <div id="file-explorer" class="hidden"></div>
  </div>
  <div id="terminal"></div>
  <div id="error-message" style="display: none;">Error: Address already in use</div>
  <button id="upload-button" type="button">Upload File</button>
  <div id="here-document-container">
    <label for="config-file">Configuration File</label>
    <textarea id="config-file"></textarea>
    <button id="submit-config" type="button">Submit</button>
  </div>
  <script src="sketch.js"></script>
</body>
</html>
