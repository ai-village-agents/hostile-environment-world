<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="style.css">
  <title>p5.js Sketch</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/showdown@2.1.0/dist/showdown.min.js"></script>
</head>
<body>
  <button id="login-button" type="button">Login</button>
  <button id="click-me-button" type="button">Click Me</button>
  <button id="restart-server" type="button">Restart Server</button>
  <div id="keyboard-button" tabindex="0" style="display: inline-block; padding: 2px 6px; border: 1px solid black; background: lightgray; cursor: pointer;">Continue</div>
  <button id="file-explorer-btn" type="button">File Explorer</button>
  <div id="main-content" style="display: none;">
    <input id="url-bar" type="text" />
    <textarea id="comment-box" rows="4" placeholder="Type your message here..."></textarea>
    <textarea id="copy-box" rows="4" placeholder="Copy text here..."></textarea>
    <textarea id="paste-box" rows="4" placeholder="Paste text here..."></textarea>
    <div>
      <label for="clipboard-source">Copy from here:</label>
      <textarea id="clipboard-source" rows="4">Sample clipboard text goes here.</textarea>
    </div>
    <button id="submit-comment" type="button">Submit</button>
    <div id="comments"></div>
  </div>
  <div id="url-redirection-container">
    <label for="address-bar">Address Bar</label>
    <input id="address-bar" type="text">
    <button id="go-button" type="button">Go</button>
    <button id="applicationMismatchBugButton" type="button">Launch Application</button>
    <button id="browserCacheBugButton" type="button">Refresh Style</button>
    <button id="corrupt-file-button" type="button">Corrupt File</button>
    <button id="corrupt-history-button" type="button">Corrupt History</button>
    <button id="deadlock-button" type="button">Engage Deadlock</button>
    <button id="ghost-directory-button" type="button">Create Ghost Directory</button>
    <button id="silent-state-loss-button" type="button">Silent State Loss</button>
    <button id="unclickable-ui-button" type="button">Unclickable UI Bug</button>
    <button id="data-loss-button" type="button">Spontaneous Data Loss</button>
    <button id="file-io-duplication-button" type="button">Simulate File I/O Duplication Bug</button>
    <button id="unflagged-merge-conflict-button" type="button">Simulate Un-flagged Merge Conflict</button>
    <button id="xpaint-commit-bug-button" type="button">Simulate XPaint Commit Bug</button>
    <button id="overwrite-failure-button" type="button">Simulate The Overwrite Failure</button>
    <button id="simulate-overwrite-failure-button" type="button">Simulate The Overwrite Failure</button>
    <button id="commit-changes-button" type="button">Commit changes</button>
    <button id="permission-hostility-button" type="button">Filesystem Permission Hostility</button>
    <button id="scroll-loop-button" type="button">Engage Scroll Loop</button>
    <button id="zombieWindowsBugButton" type="button">Create Zombie Window</button>
    <button id="gui-tool-collapse-button" type="button">Engage GUI Tool Collapse</button>
  </div>
  <div id="file-explorer-container">
    <h2>File Explorer</h2>
    <input id="path-input" type="text">
    <button id="go-button" type="button">Go</button>
    <p id="path-error" style="color: red; display: none;">Error: Please enter an absolute path.</p>
    <div id="file-explorer" class="hidden"></div>
  </div>
  <div id="terminal"></div>
  <button id="toggle-failure-log-button" type="button">Toggle Failure Log</button>
  <div id="failure-log-container" class="hidden"></div>
  <div id="error-message" style="display: none;">Error: Address already in use</div>
  <button id="upload-button" type="button">Upload File</button>
  <div id="here-document-container">
    <label for="config-file">Configuration File</label>
    <textarea id="config-file"></textarea>
    <button id="submit-config" type="button">Submit</button>
  </div>
  <div>
    <label for="secret-message">Enter secret message:</label>
    <input id="secret-message" type="text">
  </div>
  <script src="sketch.js"></script>
</body>
</html>
    <button id="pttc-button">Simulate Persistent Total Tool Collapse</button>
